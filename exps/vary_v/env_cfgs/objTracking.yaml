env:
  num_scene: 32
  num_agent_per_scene: 8
  max_episode_steps: 2048
  sensor_kwargs:
  - sensor_type: DEPTH
    uuid: depth
    resolution:
    - 256
    - 256
    position:
    - 0
    - 0.2
    - 0.0
  - sensor_type: SEMANTIC
    uuid: semantic
    resolution:
    - 256
    - 256
    position:
    - 0
    - 0.2
    - 0.0
  - sensor_type: COLOR
    uuid: color
    resolution:
    - 256
    - 256
    position:
    - 0
    - 0.2
    - 0.0
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
    obj_settings:
      path: cubic
  dynamics_kwargs:
    dt: 0.03
    ctrl_dt: 0.03
    ctrl_delay: true
    action_type: bodyrate
    cfg: drone_state
  random_kwargs:
    state_generator:
      class: TargetUniform
      kwargs:
      - position:
          mean:
          - 5.0
          - 5.0
          - 1
          half:
          - 3
          - 3
          - 0.0
        max_dis: 3.001
        min_dis: 2.999
        test: true
  visual: true
  device: cpu
  requires_grad: true
  tensor_output: true
  semantic_id: human
eval_env:
  max_episode_steps: 4096
  num_scene: 1
  num_agent_per_scene: 1
  box_noise: 1
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
    obj_settings:
      path: /home/lfx-desktop/files/obj_track/exps/vary_v/configs/obj/B/cubic.json
    render_settings:
      FOV: false
      mode: object
      view: custom
      resolution:
      - 1080
      - 1626
      position:
      - - 3
        - 3
        - 7
      - - 16.5
        - -1
        - 1.5
      trajectory: false
      velocity: false
