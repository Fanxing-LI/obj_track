env:
  num_scene: 32
  num_agent_per_scene: 8
  max_episode_steps: 2048
  sensor_kwargs:
    - sensor_type: DEPTH
      uuid: depth
      resolution:
        - 128
        - 128
      position:
        - 0
        - 0.2
        - 0.0
    - sensor_type: SEMANTIC
      uuid: semantic
      resolution:
        - 128
        - 128
      position:
        - 0
        - 0.2
        - 0.0
    - sensor_type: COLOR
      uuid: color
      resolution:
        - 128
        - 128
      position:
        - 0
        - 0.2
        - 0.0
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
    obj_settings:
      path: cubic
  dynamics_kwargs:
    dt: 0.03
    ctrl_dt: 0.03
    ctrl_delay: True
    action_type: "bodyrate"
  random_kwargs:
    state_generator:
#      class: Uniform
      class: TargetUniform
      kwargs:
        - position:
            mean: [ 5.0, 5.0, 1]
            half: [ 3, 3, 0.0 ]
          max_dis: 3.001
          min_dis: 2.999
          test: True
  visual: True
  device: cpu
  requires_grad: True
  tensor_output: True
  semantic_id: human

eval_env:
  num_scene: 1
  num_agent_per_scene: 4
  box_noise: 0
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
    obj_settings:
      path: cubic
    render_settings:
      mode: fix
      view: custom
      resolution: [1080,1920]
      position: [[15., 1, 8.5], [15, 0, 1.5]]
      trajectory: False
      velocity: True
