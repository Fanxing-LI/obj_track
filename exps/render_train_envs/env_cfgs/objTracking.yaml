env:
  num_scene: 32
  num_agent_per_scene: 8
  max_episode_steps: 2048
  sensor_kwargs:
  - sensor_type: DEPTH
    uuid: depth
    resolution:
      - 64
      - 64
    position:
      - 0
      - 0.2
      - 0.0
  - sensor_type: COLOR
    uuid: color
    resolution:
    - 64
    - 64
    position:
    - 0
    - 0.2
    - 0.0
  - sensor_type: SEMANTIC
    uuid: semantic
    resolution:
      - 64
      - 64
    position:
      - 0
      - 0.2
      - 0.0
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
    obj_settings:
      path: cubic
  dynamics_kwargs:
    dt: 0.03
    ctrl_dt: 0.03
    ctrl_delay: true
    action_type: bodyrate
  random_kwargs:
    state_generator:
      class: TargetUniform
      kwargs:
      - position:
          mean:
          - 4.0
          - 4.0
          - 1
          half:
          - 3
          - 3
          - 0.0
        max_dis: 4
        min_dis: 1
        test: false
  visual: true
  device: cpu
  requires_grad: true
  tensor_output: true
  semantic_id: human
eval_env:
  num_scene: 32
  num_agent_per_scene: 4
  box_noise: 0
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
    obj_settings:
      path: cubic
    render_settings:
      FOV: true
      mode: object
      view: custom
      resolution:
      - 240
      - 240
      position:
      - - 2
        - 2
        - 3
      - - 16.5
        - -1
        - 1.5
      trajectory: false
      velocity: false
