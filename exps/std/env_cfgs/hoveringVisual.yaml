
env:
  num_agent_per_scene: 100
  max_episode_steps: 256
  sensor_kwargs:
    - sensor_type: DEPTH
      uuid: depth
      resolution:
        - 64
        - 64
      position:
        - 0
        - 0.2
        - 0.0
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/garage_empty
  dynamics_kwargs:
    #    dt: 0.02
    #    ctrl_dt: 0.02
    #    comm_delay: False
    #    ctrl_delay: False
    action_type: "bodyrate"
  visual: True
  device: cpu
  requires_grad: True
  tensor_output: True

eval_env:
  num_agent_per_scene: 4
  max_episode_steps: 256
  tensor_output: True
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/garage_empty
    render_settings:
      mode: fix
      view: custom
      resolution: [1080,1920]
      position: [[7., 6.8, 5.5], [7, 4.8, 4.5]]
      trajectory: True
