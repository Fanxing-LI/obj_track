env:
  num_scene: 8
  num_agent_per_scene: 8
  max_episode_steps: 2048

  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box30_wall_high20_empty
    obj_settings:
      path: box30_high20/track/train_fast_agile
  dynamics_kwargs:
    dt: 0.03
    ctrl_dt: 0.03
    ctrl_delay: True
    action_type: "bodyrate"
    comm_delay: 0.06
    cfg: drone_d435i_jetson_orin_nx_fast

  random_kwargs:
    state_generator:
#      class: Uniform
      class: TargetUniform
      kwargs:
        - position:
            mean: [ 5.0, 0.0, 1]
            half: [ 2., 2., 0.2]
          velocity:
            mean: [0.0, 0.0, 0.0]
            half: [2.0, 2.0, 1.]
          min_dis: 3.0          
          max_dis: 6.0          
          test: True

  visual: True
  device: cpu
  keep_dis: 3.0
  is_collision_reset: False
  requires_grad: True
  tensor_output: True
  box_noise: 0.0

eval_env:
  num_scene: 12
  num_agent_per_scene: 1
  max_episode_steps: 1024
  sensor_kwargs:
      - sensor_type: COLOR
        uuid: color
        resolution:
          - 128
          - 128
        position:
          - 0
          - 0.0
          - -0.1
  random_kwargs:
    state_generator:
      #      class: Uniform
      class: TargetUniform
      kwargs:
        - position:
            mean: [ 5.0, 0.0, 1 ]
            half: [ 3., 3., 0.4 ]
          velocity:
            mean: [ 0.0, 0.0, 0.0 ]
            half: [ 0.0, 0.0, 0 ]
          test: True
          max_dis: 4.
          min_dis: 4.1
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box30_wall_high20_empty
    obj_settings:
      # path: box30_high20/track/test_fast_agile
      path: box30_high20/track/train_fast_agile
    render_settings:
      mode: fix
      view: custom
      axes: True
      resolution: [480,480]
      position: [[7., 6.8, 8.5], [10, 0, 1.5]]
      trajectory: False

test:
  is_video: False
  is_fig_save: True
  is_video_save: True
