env:
  num_agent_per_scene: 100
  max_episode_steps: 256
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/garage_empty
  dynamics_kwargs:
    dt: 0.03
    ctrl_dt: 0.03
    ctrl_delay: True
    action_type: "bodyrate"
  random_kwargs:
    state_generator:
      # class: Uniform
      class: TargetUniform
      kwargs:
        position:
          mean: [ 10.0, 0.0, 1.5]
          half: [ 1.0, 1.0, 0.3 ]
  visual: True
  device: cpu
  requires_grad: True
  tensor_output: True

eval_env:
  num_agent_per_scene: 4
  visual: False
  sensor_kwargs: []
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/garage_empty
    render_settings:
      mode: fix
      view: custom
      resolution: [1080,1920]
      position: [[7., 6.8, 5.5], [7, 4.8, 4.5]]
      trajectory: True
