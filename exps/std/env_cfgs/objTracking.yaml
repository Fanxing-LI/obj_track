env:
  num_scene: 32
  num_agent_per_scene: 8
  max_episode_steps: 2048
  sensor_kwargs:
    - sensor_type: DEPTH
      uuid: depth
      resolution:
        - 64
        - 64
      position:
        - 0
        - 0.2
        - 0.0
    - sensor_type: SEMANTIC
      uuid: semantic
      resolution:
        - 64
        - 64
      position:
        - 0
        - 0.2
        - 0.0
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
    obj_settings:
      path: cubic
  dynamics_kwargs:
    dt: 0.03
    ctrl_dt: 0.03
    ctrl_delay: True
    action_type: "bodyrate"
    cfg: drone_d435i_n100
  random_kwargs:
    state_generator:
#      class: Uniform
      class: TargetUniform
      kwargs:
        - position:
            mean: [ 5.0, 0.0, 1]
            half: [ 3., 3., 0.4]
          velocity:
            mean: [0.0, 0.0, 0.0]
            half: [1.0, 1.0, 0.2]

  visual: True
  device: cpu
  requires_grad: True
  tensor_output: True
  keep_dis: 3.0

eval_env:
  num_scene: 1
  num_agent_per_scene: 4
  scene_kwargs:
    path: VisFly/datasets/visfly-beta/configs/scenes/box15_wall_empty
    obj_settings:
      path: cubic
    render_settings:
      mode: fix
      view: custom
      resolution: [1080,1920]
      position: [[7., 6.8, 8.5], [10, 0, 1.5]]
      trajectory: True
