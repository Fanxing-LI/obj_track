algorithm:
  policy: SimplePolicy
  policy_kwargs:
    features_extractor_class: StateExtractor
    features_extractor_kwargs:
      net_arch:
        state:
          layer: [256]
          # ln: True
#          bn: True
        depth:
          channel: [ 32, 64,128]
          kernel_size: 2
          stride: 2
          padding: 1
          layer: [256]
    critic:
      dist: mse
      n_critics: 2
      net_arch:
        layer: [256, 256]
    actor:
      dist: normal
      net_arch:
        layer: [256, 256]

    activation_fn: relu
    optimizer_class: adam
    optimizer_kwargs:
      weight_decay: 0.00001
    share_features_extractor: False
  learning_rate: 0.002
  horizon: 96
  tau: 0.005
  gamma: 0.99
  gradient_steps: 10
  train_freq: 48
  batch_size: 25600
  actor_gradient_steps: 100
  buffer_size: 32
  scene_freq: 1000000

learn:
  total_timesteps: 30000000
  log_interval: 1

test:
  is_fig: True
  is_fig_save: True
  is_video: True
  is_video_save: True
  render_kwargs: { }