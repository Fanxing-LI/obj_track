algorithm:
  policy: SimplePolicy
  policy_kwargs:
    features_extractor_class: StateImageExtractor
    features_extractor_kwargs:
      net_arch:
        state:
          layer: [512,512]
        depth:
          channel: [32, 64, 128,256]
          kernel_size: 4
          stride: 2
          padding: 1
#          ln: True
          bn: True
          output_channel: 3
          bias: False

    critic:
      dist: symlog_disc
      n_critics: 1
      net_arch:
        layer: [512, 512]
    actor:
      dist: tanh_normal
#      squash_output: False
      net_arch:
        layer: [512, 512]
#    ln: True
    activation_fn: silu
    optimizer_class: adam
    optimizer_kwargs:
      weight_decay: 0.00001
  learning_rate: 0.001
  horizon: 72
  tau: 0.005
  gamma: 0.99
  device: cuda
  gradient_steps: 10
  train_freq: 96
  batch_size: 25600
  actor_gradient_steps: 1

learn:
  total_timesteps: 1000000
  log_interval: 1

test:
  is_fig: True
  is_fig_save: True
  is_video: True
  is_video_save: True
  render_kwargs: { }