algorithm:
  policy: MultiInputPolicy
  policy_kwargs:
    features_extractor_class: StateExtractor
    features_extractor_kwargs:
      net_arch:
        state:
          layer: [512]

    net_arch:
      pi: [512, 256]
      qf: [512, 256]
    activation_fn: relu
    optimizer_kwargs:
      weight_decay: 0.00001
    share_features_extractor: False
  learning_rate: 0.0002
  tau: 0.005
  gamma: 0.99
  device: cuda
  gradient_steps: 10
  batch_size: 256
  train_freq: 10
  verbose: True
  buffer_size: 2000000
  scene_freq: 3000000

learn:
  total_timesteps: 25000000
  log_interval: 100

test:
  is_fig: True
  is_fig_save: True
  is_render: True
  is_video: True
  is_video_save: True
  render_kwargs: {}


